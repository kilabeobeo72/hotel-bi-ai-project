# File: lab_project/dbt/hotel_dw/models/marts/schema.yml
version: 2

models:
  - name: dim_date
    description: "Bảng chiều thời gian từ 2014 đến 2018"
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null

  - name: dim_hotel
    description: "Bảng chiều thông tin và phân loại khách sạn"
    columns:
      - name: hotel_key
        tests:
          - unique
          - not_null
      - name: hotel_name
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Resort Hotel', 'City Hotel']
      - name: hotel_category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Resort', 'City']

  - name: dim_customer
    description: "Bảng chiều phân khúc khách hàng và nhóm khách"
    columns:
      - name: customer_key
        tests:
          - unique
          - not_null
      - name: customer_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Transient', 'Contract', 'Transient-Party', 'Group']
      - name: guest_group_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Solo', 'Couple', 'Family', 'Group']

  - name: dim_channel
    description: "Bảng chiều kênh phân phối và đại lý"
    columns:
      - name: channel_key
        tests:
          - unique
          - not_null
      - name: market_segment
        tests:
          - not_null
      - name: distribution_channel
        tests:
          - not_null

  - name: dim_room_policy
    description: "Bảng chiều chính sách phòng, bữa ăn và đặt cọc"
    columns:
      - name: policy_key
        tests:
          - unique
          - not_null
      - name: meal_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BB', 'HB', 'FB', 'SC']
      - name: deposit_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['No Deposit', 'Non Refund', 'Refundable']

  - name: fact_bookings
    description: "Bảng sự kiện trung tâm lưu trữ giao dịch đặt phòng khách sạn"
    columns:
      - name: booking_key
        tests:
          - unique
          - not_null
      - name: hotel_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hotel')
                field: hotel_key
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: channel_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channel')
                field: channel_key
      - name: policy_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_room_policy')
                field: policy_key
      - name: arrival_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: status_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: is_canceled
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]